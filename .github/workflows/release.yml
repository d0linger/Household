name: Production image
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions: {contents: read}
  browser:
    uses: ./.github/workflows/browser.yml
    permissions: {contents: read}
  shopping:
    uses: ./.github/workflows/shopping-extensions.yml
    permissions: {contents: read}
  recovery:
    uses: ./.github/workflows/fuel-ocr-recovery.yml
    permissions: {contents: read}
  candidate:
    uses: ./.github/workflows/container.yml
    permissions: {contents: read}
  publish:
    name: Publish verified production image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'd0linger/Household'
    needs: [quality, browser, shopping, recovery, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: household-production-publication
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24'}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: household-container-candidate
          path: ${{ runner.temp }}/household-candidate
      - name: Install registry copy tool from signed runner distribution
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          skopeo --version
      - name: Verify and promote the same scanned image without rebuilding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_DIRECTORY: ${{ runner.temp }}/household-candidate
        run: bash scripts/publish-production.sh
