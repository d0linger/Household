name: Container and release candidate
on:
  pull_request:
  push:
    branches: [main,dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          tags: household:ci
          push: false
          outputs: type=oci,dest=/tmp/household.oci.tar
          provenance: mode=max
          sbom: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '24'}
      - name: Verify exported Household image and attestations
        run: |
          mkdir -p /tmp/household-oci
          tar -xf /tmp/household.oci.tar -C /tmp/household-oci
          node scripts/check-oci.cjs /tmp/household-oci /tmp/household-candidate.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: household-container-candidate
          path: |
            /tmp/household.oci.tar
            /tmp/household-candidate.json
          retention-days: 7
