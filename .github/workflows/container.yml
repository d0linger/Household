name: Container and release candidate
on:
  pull_request:
  push:
    branches: [main,dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          tags: household:ci
          push: false
          outputs: type=oci,dest=/tmp/household.oci.tar
          provenance: mode=max
          sbom: true
      - name: Inspect candidate identity
        run: docker buildx imagetools inspect --raw docker.io/library/alpine:3.24 > /tmp/base-image-manifest.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: household-container-candidate
          path: |
            /tmp/household.oci.tar
            /tmp/base-image-manifest.json
          retention-days: 7
