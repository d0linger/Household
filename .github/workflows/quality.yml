name: Go quality and security
on:
  push:
    branches: [dev]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  GOLint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - run: golangci-lint run --build-tags=integration,testtools ./...
      - run: test -z "$(gofmt -l cmd internal)"
  GOSec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
      - run: gosec -fmt=sarif -out=gosec.sarif ./cmd/... ./internal/...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: gosec-report, path: gosec.sarif, retention-days: 14, if-no-files-found: error}
  GOVul:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
  GODep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - run: go mod download && go mod verify
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: go run ./cmd/dependency-check > dependency-report.md
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24'}
      - name: Verify migration manifest and immutable history
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-migrations.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: dependency-review, path: dependency-report.md, retention-days: 14}
      - name: Review newly introduced dependency vulnerabilities
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
  UnitTests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24'}
      - name: Run shuffled unit tests without database fixtures
        run: |
          mkdir -p outputs/qa/unit
          go test -p 1 ./... -count=1 -shuffle=on -coverprofile=outputs/qa/unit/coverage.out -timeout=3m
      - name: Enforce the separate unit coverage floor
        run: node scripts/check-coverage.cjs outputs/qa/unit/coverage.out 14 outputs/qa/unit/coverage.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: go-unit-coverage, path: outputs/qa/unit, retention-days: 14, if-no-files-found: error}
  Tests:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env: {POSTGRES_DB: household_test, POSTGRES_PASSWORD: ci-database-only}
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U postgres -d household_test" --health-interval=3s --health-timeout=3s --health-retries=15
    env:
      HOUSEHOLD_REQUIRE_INTEGRATION: '1'
      HOUSEHOLD_TEST_OWNER_URL: postgres://household_owner:ci-owner-only@localhost:5432/household_test?sslmode=disable
      HOUSEHOLD_TEST_APP_URL: postgres://household_app:ci-app-only@localhost:5432/household_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - name: Install and verify PDF and OCR test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils fonts-liberation tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
          pdfinfo -v
          pdftotext -v
          pdftoppm -v
          pdfseparate -v
          pdfunite -v
          tesseract --version
          tesseract --list-langs > "$RUNNER_TEMP/household-ocr-languages.txt"
          cat "$RUNNER_TEMP/household-ocr-languages.txt"
          grep -Fxq eng "$RUNNER_TEMP/household-ocr-languages.txt"
          grep -Fxq deu "$RUNNER_TEMP/household-ocr-languages.txt"
      - name: Initialize isolated roles
        env: {PGPASSWORD: ci-database-only}
        run: |
          psql -h localhost -U postgres -d household_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE household_owner LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD 'ci-owner-only';
          CREATE ROLE household_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD 'ci-app-only';
          ALTER DATABASE household_test OWNER TO household_owner;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          SQL
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24'}
      - run: go vet -tags=integration,testtools ./...
      - name: Discover and run one deterministic shard with race detection
        run: node scripts/run-go-test-shard.cjs "${{ matrix.shard }}" 6 "outputs/qa/shard-${{ matrix.shard }}" "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: go-test-shard-${{ matrix.shard }}
          path: outputs/qa/shard-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: error
  Coverage:
    needs: [Tests, UnitTests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful unit and integration jobs
        if: ${{ needs.Tests.result != 'success' || needs.UnitTests.result != 'success' }}
        run: |
          echo '::error::Unit tests and every integration shard must pass before accepting coverage.'
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24'}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: go-test-shard-*
          path: outputs/shards
          merge-multiple: false
          digest-mismatch: error
      - name: Verify all six inventories, terminal passes, source and block definitions
        run: node scripts/merge-go-test-shards.cjs outputs/shards outputs/qa "$GITHUB_SHA"
      - name: Enforce observed combined integration coverage floor
        run: node scripts/check-coverage.cjs outputs/qa/coverage.out 55 outputs/qa/coverage.json
      - name: Render Go statement coverage HTML
        run: go tool cover -html=outputs/qa/coverage.out -o outputs/qa/coverage.html
      - name: Fuzz exact money parsing
        run: go test ./internal/value -run=^$ -fuzz=FuzzMinor -fuzztime=15s -parallel=2
      - name: Fuzz exact decimal parsing
        run: go test ./internal/value -run=^$ -fuzz=FuzzDecimal -fuzztime=15s -parallel=2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: go-coverage-evidence, path: outputs/qa, retention-days: 14, if-no-files-found: error}
  WorkflowAndSecrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts
      - run: node --test scripts/documents-workspace-navigation.test.cjs scripts/finance-workspace-navigation.test.cjs scripts/workspace-navigation-operational.test.cjs scripts/today.test.cjs scripts/quality-tools.test.cjs scripts/release-guard.test.cjs scripts/release-policy.test.cjs scripts/local-artifacts.test.cjs scripts/theme.test.cjs scripts/security.test.cjs scripts/finance-reminders.test.cjs scripts/localization.test.cjs scripts/shopping-input.test.cjs scripts/shopping-checkout.test.cjs scripts/recipe-workspace.test.cjs scripts/recipe-expansion.test.cjs scripts/cooking.test.cjs scripts/planning.test.cjs scripts/mealplan-extensions.test.cjs scripts/planning-suggestions.test.cjs scripts/planning-purchases.test.cjs scripts/pantry-daily.test.cjs scripts/ingredient-pantry.test.cjs scripts/cooking-stock.test.cjs scripts/pantry-batches.test.cjs scripts/expense-editor.test.cjs scripts/finance-workspace.test.cjs scripts/report-values.test.cjs scripts/shopping-repurchase.test.cjs scripts/shopping-barcode.test.cjs scripts/pantry-waste.test.cjs scripts/fuel-overview.test.cjs scripts/fuel-module-values.test.cjs scripts/go-test-shards.test.cjs scripts/fuel-browser-contracts.test.cjs scripts/pantry-extensions.test.cjs scripts/shopping-extensions.test.cjs scripts/push-worker.test.cjs scripts/notification-settings.test.cjs scripts/design-preview.test.cjs
      - name: Verify generated design preview assets match their sources
        run: node scripts/build-design-preview.cjs --check
      - run: node scripts/check-local-artifacts.cjs --index
      - run: node scripts/check-workflows.cjs
      - name: Verify checked task list matches acceptance evidence
        run: node scripts/update-tasklist.cjs --check
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: actionlint
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: gitleaks git --redact --no-banner --log-opts=--all
