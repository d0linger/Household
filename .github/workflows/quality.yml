name: Go quality and security
on:
  push:
    branches: [main,dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  GOLint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: {go-version-file: go.mod, cache: true}
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - run: golangci-lint run --build-tags=integration,testtools ./...
      - run: test -z "$(gofmt -l cmd internal)"
  GOSec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: {go-version-file: go.mod, cache: true}
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
      - run: gosec -fmt=sarif -out=gosec.sarif ./...
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with: {name: gosec-report, path: gosec.sarif, retention-days: 14, if-no-files-found: error}
  GOVul:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: {go-version-file: go.mod, cache: true}
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
  GODep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: {go-version-file: go.mod, cache: true}
      - run: go mod download && go mod verify
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: go run ./cmd/dependency-check > dependency-report.md
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '24'}
      - name: Verify migration manifest and immutable history
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-migrations.cjs
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with: {name: dependency-review, path: dependency-report.md, retention-days: 14}
  Tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env: {POSTGRES_DB: household_test, POSTGRES_PASSWORD: ci-database-only}
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U postgres -d household_test" --health-interval=3s --health-timeout=3s --health-retries=15
    env:
      HOUSEHOLD_REQUIRE_INTEGRATION: '1'
      HOUSEHOLD_TEST_OWNER_URL: postgres://household_owner:ci-owner-only@localhost:5432/household_test?sslmode=disable
      HOUSEHOLD_TEST_APP_URL: postgres://household_app:ci-app-only@localhost:5432/household_test?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: {go-version-file: go.mod, cache: true}
      - name: Initialize isolated roles
        env: {PGPASSWORD: ci-database-only}
        run: |
          psql -h localhost -U postgres -d household_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE household_owner LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD 'ci-owner-only';
          CREATE ROLE household_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD 'ci-app-only';
          ALTER DATABASE household_test OWNER TO household_owner;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          SQL
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '24'}
      - run: go vet -tags=integration,testtools ./...
      - name: Unit and isolated integration tests with race detection
        run: |
          mkdir -p outputs/qa
          set -o pipefail
          go test -race -p 1 -tags=integration -shuffle=on -coverpkg=./internal/... -covermode=atomic -coverprofile=outputs/qa/coverage.out ./... -count=1 -timeout=30m -json | tee outputs/qa/tests.jsonl
      - name: Enforce observed integration coverage floor
        run: node scripts/check-coverage.cjs outputs/qa/coverage.out 55 outputs/qa/coverage.json
      - name: Fuzz exact money parsing
        run: go test ./internal/value -run=^$ -fuzz=FuzzMinor -fuzztime=15s -parallel=2
      - name: Fuzz exact decimal parsing
        run: go test ./internal/value -run=^$ -fuzz=FuzzDecimal -fuzztime=15s -parallel=2
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with: {name: go-test-evidence, path: outputs/qa, retention-days: 14}
  WorkflowAndSecrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: {go-version-file: go.mod, cache: true}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts
      - run: node --test scripts/quality-tools.test.cjs scripts/shopping-input.test.cjs scripts/shopping-checkout.test.cjs scripts/recipe-workspace.test.cjs scripts/cooking.test.cjs scripts/planning.test.cjs scripts/planning-purchases.test.cjs scripts/pantry-daily.test.cjs scripts/ingredient-pantry.test.cjs scripts/cooking-stock.test.cjs scripts/pantry-batches.test.cjs
      - run: node scripts/check-workflows.cjs
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: actionlint
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: gitleaks git --redact --no-banner --log-opts=--all
