name: Scheduled security maintenance
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-maintenance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  GoVulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
  NodeVulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24', cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high --ignore-scripts
  ParserFuzzing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: true}
      - name: Fuzz exact money parsing
        run: go test ./internal/value -run='^$' -fuzz='^FuzzMinor$' -fuzztime=45s -parallel=2 -timeout=2m
      - name: Fuzz exact decimal parsing
        run: go test ./internal/value -run='^$' -fuzz='^FuzzDecimal$' -fuzztime=45s -parallel=2 -timeout=2m
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: scheduled-fuzz-regressions
          path: internal/value/testdata/fuzz
          retention-days: 14
          if-no-files-found: warn
