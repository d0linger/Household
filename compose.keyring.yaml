# Optional: use after compose.yaml. Requires Docker Compose 2.24.4 or later.
# No secret is generated or replaced on the host. The explicit file is private.
# Matching secret targets replace only the legacy encryption mount; unrelated
# optional secrets (Web Push, adapters) survive Compose's normal merge rules.
services:
  app:
    environment:
      HOUSEHOLD_ENCRYPTION_KEY: !reset null
      HOUSEHOLD_ENCRYPTION_KEY_FILE: !reset null
      HOUSEHOLD_ENCRYPTION_KEYRING: !reset null
      HOUSEHOLD_ENCRYPTION_KEYRING_FILE: /run/secrets/encryption_key
    secrets:
      - source: encryption_keyring
        target: encryption_key
  migrate:
    environment:
      HOUSEHOLD_ENCRYPTION_KEY: !reset null
      HOUSEHOLD_ENCRYPTION_KEY_FILE: !reset null
      HOUSEHOLD_ENCRYPTION_KEYRING: !reset null
      HOUSEHOLD_ENCRYPTION_KEYRING_FILE: /run/secrets/encryption_key
    secrets:
      - source: encryption_keyring
        target: encryption_key
secrets:
  encryption_keyring:
    file: ${HOUSEHOLD_ENCRYPTION_KEYRING_PATH:?Set the private reviewed encryption keyring file path}
