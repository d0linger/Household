# Household – Anleitung: docs/installation.md
#   docker run --rm ghcr.io/d0linger/household:production init > .env
#   HOUSEHOLD_ORIGIN in .env eintragen, dann: docker compose up -d
x-household: &household
  image: ${HOUSEHOLD_IMAGE:-ghcr.io/d0linger/household:production}
  restart: unless-stopped
  read_only: true
  tmpfs: ['/tmp:size=128m']
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  env_file: .env
  stop_grace_period: 20s
  logging: {options: {max-size: 10m, max-file: '3'}}

services:
  db:
    image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    user: '70:70'
    restart: unless-stopped
    environment:
      POSTGRES_DB: household
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Zuerst .env mit "household init" erzeugen}
    volumes: [postgres:/var/lib/postgresql]
    healthcheck: {test: [CMD-SHELL, pg_isready -U postgres -d household], interval: 5s}

  app:
    <<: *household
    command: start
    volumes:
      - uploads:/data/uploads
      # - ./scanner:/inbox:ro                # optional, dazu HOUSEHOLD_DOCUMENT_WATCH_DIR=/inbox
    ports: ['127.0.0.1:${HOUSEHOLD_PORT:-8100}:8080']
    depends_on: {db: {condition: service_healthy}}

  backup:                                    # tägliches Backup um 03:00, auch für Wartungsbefehle
    <<: *household
    command: backup-loop
    environment: {HOUSEHOLD_DATABASE_USER: household_owner, HOUSEHOLD_DATABASE_PASSWORD: '${HOUSEHOLD_OWNER_PASSWORD}'}
    volumes: [uploads:/data/uploads:ro, backups:/data/backups, backup_work:/work]
    healthcheck: {disable: true}
    depends_on: {app: {condition: service_healthy}}

volumes: {postgres: {}, uploads: {}, backups: {}, backup_work: {}}
