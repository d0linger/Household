name: household-tests
services:
  db:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    command: [postgres, -c, max_wal_size=128MB, -c, min_wal_size=32MB, -c, checkpoint_timeout=1min]
    environment:
      POSTGRES_DB: household_test
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    ports: ['127.0.0.1:55434:5432']
    secrets: [postgres_password,owner_password,app_password]
    volumes: [./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/10-household.sh:ro]
    tmpfs: ['/var/lib/postgresql:rw,size=1g']
    healthcheck: {test: [CMD-SHELL, pg_isready -U postgres -d household_test], interval: 2s, timeout: 3s, retries: 20}
secrets:
  postgres_password: {file: .local/secrets/postgres_password}
  owner_password: {file: .local/secrets/owner_password}
  app_password: {file: .local/secrets/app_password}
