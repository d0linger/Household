# Optional fixed-origin network inputs. Enable individually, then approve in Documents.
# Use Docker secrets or read-only files with the *_FILE settings for actual credentials.
services:
  app:
    environment:
      HOUSEHOLD_DOCUMENT_IMAP_ADDRESS: ${HOUSEHOLD_DOCUMENT_IMAP_ADDRESS:-}
      HOUSEHOLD_DOCUMENT_IMAP_USER: ${HOUSEHOLD_DOCUMENT_IMAP_USER:-}
      HOUSEHOLD_DOCUMENT_IMAP_MAILBOX: ${HOUSEHOLD_DOCUMENT_IMAP_MAILBOX:-}
      HOUSEHOLD_DOCUMENT_IMAP_PASSWORD_FILE: ${HOUSEHOLD_DOCUMENT_IMAP_PASSWORD_FILE:-}
      HOUSEHOLD_DOCUMENT_PAPERLESS_URL: ${HOUSEHOLD_DOCUMENT_PAPERLESS_URL:-}
      HOUSEHOLD_DOCUMENT_PAPERLESS_TAG: ${HOUSEHOLD_DOCUMENT_PAPERLESS_TAG:-}
      HOUSEHOLD_DOCUMENT_PAPERLESS_TOKEN_FILE: ${HOUSEHOLD_DOCUMENT_PAPERLESS_TOKEN_FILE:-}
