{{define "documents-workspace"}}
<link rel="stylesheet" href="{{index .Asset "documents.css"}}">
<section id="documents-workspace" data-pane="{{index .Extra "pane"}}" data-document="{{index .Extra "document_id"}}" data-return-pane="{{index .Extra "return_pane"}}" aria-busy="true">
 <div class="page-heading"><div><h1>{{t "Dokumente & Fristen"}}</h1><p class="muted">{{t "Originale bewahren. Angaben prüfen. Fristen im Blick behalten."}}</p></div>{{if .User.CanWrite}}<button id="doc-new" class="primary" type="button">{{t "Neues Dokument"}}</button>{{end}}</div>
 {{template "workspace-nav" .}}
 <section id="doc-selection-context" class="doc-selection-context" aria-labelledby="doc-selection-title" hidden>
  <div><h2 id="doc-selection-title"></h2><p id="doc-selection-state" class="muted"></p></div>
  <a id="doc-selection-back" class="button" href="/m/documents/workspace/library">{{t "Zur Dokumentenliste"}}</a>
  <nav id="doc-selection-tools" class="doc-selection-tools" aria-label="{{t "Werkzeuge für dieses Dokument"}}"></nav>
 </section>
 <p id="doc-status" class="notice" role="status">{{t "Dokumente werden geladen …"}}</p>
 <section id="doc-error" class="notice error" role="alert" tabindex="-1" hidden><h2>{{t "Bitte prüfen"}}</h2><p id="doc-error-text"></p><div class="actions"><button id="doc-retry" type="button" hidden>{{t "Unveränderten Vorgang wiederholen"}}</button><button id="doc-current" type="button" hidden>{{t "Aktuellen Stand daneben laden"}}</button></div><div id="doc-conflict"></div></section>
 <div id="doc-filters"></div><div id="doc-batch"></div><div id="doc-content"></div><div id="doc-editor"></div><div id="doc-paging" class="actions"></div>
 <noscript><p>{{t "Die geführte Prüfung benötigt das lokal bereitgestellte JavaScript."}} <a href="/m/documents/documents">{{t "Bisherige Dokumentenliste öffnen"}}</a>.</p></noscript>
</section>
<script nonce="{{.Nonce}}" src="{{index .Asset "documents-workspace.js"}}" defer></script>
{{end}}
